# DoctorHealthy1 Security Configuration
# This file contains security policies and configurations for production deployment

security:
  # SSL/TLS Configuration
  ssl:
    enabled: true
    provider: letsencrypt
    email: admin@doctorhealthy1.com
    auto_renewal: true
    security_level: modern
    ciphers:
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384

  # Firewall Configuration
  firewall:
    enabled: true
    default_policy: drop
    allowed_ports:
      - 80   # HTTP
      - 443  # HTTPS
      - 22   # SSH (restricted)
    allowed_services:
      - http
      - https
      - ssh
    rate_limiting:
      requests_per_minute: 1000
      burst_limit: 2000

  # Fail2Ban Configuration
  fail2ban:
    enabled: true
    maxretry: 5
    bantime: 3600  # 1 hour
    findtime: 600  # 10 minutes
    jails:
      - name: ssh
        port: ssh
        logpath: /var/log/auth.log
      - name: nginx-http-auth
        port: http,https
        logpath: /var/log/nginx/error.log
      - name: nginx-noscript
        port: http,https
        logpath: /var/log/nginx/access.log

  # Container Security
  containers:
    security_defaults:
      read_only: true
      no_new_privileges: true
      drop_capabilities: ALL
      add_capabilities:
        - NET_BIND_SERVICE
        - SYS_CHROOT
      tmpfs:
        - /tmp:noexec,nosuid,size=100m
        - /var/run:noexec,nosuid,size=100m
        - /var/cache/nginx:noexec,nosuid,size=100m

  # Application Security Headers
  security_headers:
    enabled: true
    headers:
      X-Frame-Options: "SAMEORIGIN"
      X-Content-Type-Options: "nosniff"
      X-XSS-Protection: "1; mode=block"
      Strict-Transport-Security: "max-age=31536000; includeSubDomains; preload"
      Content-Security-Policy: "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://api.doctorhealthy1.com"
      Referrer-Policy: "strict-origin-when-cross-origin"
      Permissions-Policy: "camera=(), microphone=(), geolocation=()"
      Expect-CT: "max-age=86400, enforce"

  # API Security
  api_security:
    rate_limiting:
      enabled: true
      requests_per_window: 1000
      window_size: "1m"
      burst_limit: 2000
    authentication:
      required: true
      token_expiry: 365d
      refresh_tokens: true
    cors:
      enabled: true
      allowed_origins:
        - https://super.doctorhealthy1.com
        - https://api.doctorhealthy1.com
        - https://test.doctorhealthy1.com
      allowed_methods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
      allowed_headers:
        - Authorization
        - Content-Type
        - X-API-Key
        - X-Requested-With

  # Database Security
  database:
    encryption: true
    ssl_mode: require
    connection_pooling: true
    max_connections: 25
    idle_connections: 5
    connection_timeout: 30s
    query_timeout: 60s
    audit_logging: true

  # Monitoring & Alerting
  monitoring:
    security_events: true
    failed_login_attempts: true
    suspicious_activities: true
    alerting:
      enabled: true
      channels:
        - email
        - slack
        - webhook
      thresholds:
        high_cpu: 80%
        high_memory: 85%
        high_disk: 90%
        failed_requests: 100

  # Backup Security
  backups:
    encryption: true
    compression: true
    retention_policy: 30d
    access_control: restricted
    integrity_checks: true

  # File Upload Security (if applicable)
  file_uploads:
    enabled: false
    max_file_size: 10MB
    allowed_types:
      - image/jpeg
      - image/png
      - image/webp
    virus_scanning: true

  # Session Management
  sessions:
    secure_cookies: true
    http_only: true
    same_site: strict
    max_age: 24h
    rotation: true

# Security Audit Configuration
audit:
  enabled: true
  log_level: info
  retention: 90d
  events:
    - authentication
    - authorization
    - data_access
    - configuration_changes
    - system_events

# Compliance Configuration
compliance:
  gdpr: true
  hipaa: true
  data_retention: 7y
  breach_notification: 72h

# Emergency Protocols
emergency:
  lockdown_mode: false
  maintenance_mode: false
  backup_contacts:
    - admin@doctorhealthy1.com
    - security@doctorhealthy1.com
  emergency_procedures:
    - data_backup
    - service_isolation
    - incident_response