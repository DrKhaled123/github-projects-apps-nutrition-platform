# PostgreSQL Production Configuration
# Optimized for DoctorHealthy Health Platform
# HIPAA-Compliant Settings

# Connection Settings
listen_addresses = '*'
port = 5432
max_connections = 200
superuser_reserved_connections = 3

# Memory Settings (Production Optimized)
shared_buffers = 256MB          # 25% of RAM on 1GB system
effective_cache_size = 1GB      # 75% of RAM
work_mem = 4MB                  # Per connection
maintenance_work_mem = 64MB
dynamic_shared_memory_type = posix

# WAL Settings (High Availability & Performance)
wal_level = replica
max_wal_size = 1GB
min_wal_size = 80MB
checkpoint_completion_target = 0.9
checkpoint_timeout = 10min
wal_buffers = 16MB
wal_writer_delay = 200ms
commit_delay = 0
commit_siblings = 5

# Replication Settings
max_wal_senders = 10
max_replication_slots = 10
wal_keep_segments = 32
hot_standby = on
max_standby_streaming_delay = 30s
wal_receiver_status_interval = 10s
hot_standby_feedback = off

# Query Planning
random_page_cost = 1.1          # SSD optimized
effective_io_concurrency = 200  # SSD optimized
seq_page_cost = 1.0
cpu_tuple_cost = 0.01
cpu_index_tuple_cost = 0.005
cpu_operator_cost = 0.0025

# Logging (HIPAA Compliance)
logging_collector = on
log_destination = 'stderr,csvlog'
log_directory = 'pg_log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_file_mode = 0600
log_truncate_on_rotation = off
log_rotation_age = 1d
log_rotation_size = 100MB
log_min_messages = warning
log_min_error_statement = error
log_connections = on
log_disconnections = on
log_duration = on
log_statement = 'mod'           # Log DDL, DML, and prepared statements
log_checkpoints = on
log_lock_waits = on
log_temp_files = 0
log_autovacuum_min_duration = 0
log_error_verbosity = default

# Security Settings (HIPAA Compliance)
ssl = on
ssl_cert_file = '/var/lib/postgresql/server.crt'
ssl_key_file = '/var/lib/postgresql/server.key'
ssl_ca_file = '/var/lib/postgresql/root.crt'
ssl_crl_file = '/var/lib/postgresql/root.crl'
password_encryption = scram-sha-256
authentication_timeout = 1min
ssl_protocols = 'TLSv1.2,TLSv1.3'
ssl_ciphers = 'HIGH:MEDIUM:+3DES:!aNULL:!SSLv2:!SSLv3'
ssl_prefer_server_ciphers = on

# Performance Monitoring
track_activities = on
track_counts = on
track_io_timing = on
track_functions = all
track_activity_query_size = 1024
log_planner_stats = off
log_executor_stats = off

# Autovacuum (Performance & Maintenance)
autovacuum = on
log_autovacuum_min_duration = 0
autovacuum_max_workers = 3
autovacuum_naptime = 1min
autovacuum_vacuum_threshold = 50
autovacuum_analyze_threshold = 50
autovacuum_vacuum_scale_factor = 0.2
autovacuum_analyze_scale_factor = 0.1
autovacuum_freeze_max_age = 200000000
autovacuum_multixact_freeze_max_age = 400000000
autovacuum_vacuum_cost_delay = 2ms
autovacuum_vacuum_cost_limit = -1

# Background Writer
bgwriter_delay = 200ms
bgwriter_lru_maxpages = 100
bgwriter_lru_multiplier = 2.0
bgwriter_flush_after = 0

# Asynchronous Behavior
effective_io_concurrency = 200
maintenance_io_concurrency = 10
max_parallel_workers_per_gather = 2
max_parallel_workers = 8
max_parallel_maintenance_workers = 4

# Locale and Formatting
datestyle = 'iso, mdy'
timezone = 'UTC'
lc_messages = 'en_US.utf8'
lc_monetary = 'en_US.utf8'
lc_numeric = 'en_US.utf8'
lc_time = 'en_US.utf8'
default_text_search_config = 'pg_catalog.english'

# Full Text Search
default_text_search_config = 'pg_catalog.english'

# Statistics
stats_temp_directory = 'pg_stat_tmp'
track_activity_query_size = 1024

# Client Connection Defaults
default_transaction_isolation = 'read committed'
default_transaction_read_only = off
default_transaction_deferrable = off
session_replication_role = 'origin'
statement_timeout = 0
lock_timeout = 0
idle_in_transaction_session_timeout = 30min
vacuum_freeze_min_age = 50000000
vacuum_freeze_table_age = 150000000
vacuum_multixact_freeze_min_age = 5000000
vacuum_multixact_freeze_table_age = 150000000
vacuum_cleanup_index_scale_factor = 0.1
bytea_output = 'hex'
xmlbinary = 'base64'
xmloption = 'content'

# Shared Preload Libraries (for monitoring)
shared_preload_libraries = 'pg_stat_statements,auto_explain'
pg_stat_statements.track = all
pg_stat_statements.max = 10000
pg_stat_statements.track_utility = on
pg_stat_statements.save = on
auto_explain.log_min_duration = 1000
auto_explain.log_analyze = on
auto_explain.log_verbose = on
auto_explain.log_format = json
auto_explain.log_timing = on
auto_explain.log_triggers = off
auto_explain.log_counts = off
auto_explain.log_settings = off
auto_explain.sample_rate = 0.1

# JIT Compilation
jit = on
jit_above_cost = 100000
jit_inline_above_cost = 500000
jit_optimize_above_cost = 500000

# Recovery Settings (for replica)
recovery_min_apply_delay = 0
max_standby_archive_delay = 30s
max_standby_streaming_delay = 30s
wal_receiver_create_temp_slot = off
hot_standby = on
