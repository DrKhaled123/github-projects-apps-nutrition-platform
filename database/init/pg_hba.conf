# PostgreSQL Host-Based Authentication (HBA) Configuration
# HIPAA-Compliant Access Control
# TYPE  DATABASE        USER            ADDRESS                 METHOD

# "local" is for Unix domain socket connections only
local   all             postgres                                peer
local   all             doctorhealthy                           md5

# IPv4 local connections:
host    all             doctorhealthy   127.0.0.1/32            md5
host    all             doctorhealthy   172.20.0.0/16           md5
host    all             doctorhealthy   10.0.0.0/8              md5

# IPv6 local connections:
host    all             doctorhealthy   ::1/128                 md5

# Allow replication connections from localhost, by a user with the
# replication privilege.
local   replication     replicator                              peer
host    replication     replicator      127.0.0.1/32            md5
host    replication     replicator      172.20.0.0/16           md5

# Database-specific access rules
host    doctorhealthy   doctorhealthy   172.20.0.0/16           md5

# Read-only replica access
host    doctorhealthy   readonly_user    172.20.0.0/16           md5

# Monitoring access
host    doctorhealthy   monitoring_user  172.20.0.0/16           md5

# Backup service access
host    doctorhealthy   backup_user      172.20.0.0/16           md5

# External application access (if needed)
# host    doctorhealthy   app_user        0.0.0.0/0               md5

# SSL Requirements for external connections
hostssl all             doctorhealthy   0.0.0.0/0               md5
hostssl replication     replicator      0.0.0.0/0               md5

# Deny all other connections by default
host    all             all             0.0.0.0/0               reject
