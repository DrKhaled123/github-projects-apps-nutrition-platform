version: '3.8'

services:
  # Frontend Service
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: doctorhealthy1-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      - NODE_ENV=production
      - API_URL=http://backend:8081
    depends_on:
      - backend
    networks:
      - doctorhealthy1-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health.html"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Backend Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: doctorhealthy1-backend
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - PORT=8081
      - HOST=0.0.0.0
      - ENV=production
      - DB_PATH=/app/data/apikeys.db
      - JWT_SECRET=${JWT_SECRET}
      - COOLIFY_API_TOKEN=${COOLIFY_API_TOKEN}
      - COOLIFY_APP_UUID=${COOLIFY_APP_UUID}
      - DOCKER_USERNAME=${DOCKER_USERNAME}
      - DOCKER_PASSWORD=${DOCKER_PASSWORD}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - RATE_LIMIT_REQUESTS=1000
      - RATE_LIMIT_WINDOW=1m
      - CORS_ORIGINS=https://super.doctorhealthy1.com,https://api.doctorhealthy1.com
      - APP_NAME=DoctorHealthy1
      - APP_VERSION=1.0.0
      - LOG_LEVEL=info
      - ENABLE_DEBUG=false
      - GIN_MODE=release
    volumes:
      - ./data:/app/data:rw
    networks:
      - doctorhealthy1-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Monitoring Service
  monitoring:
    image: prom/prometheus:latest
    container_name: doctorhealthy1-monitoring
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - doctorhealthy1-network

  # Database backup service
  db-backup:
    image: alpine:latest
    container_name: doctorhealthy1-db-backup
    restart: unless-stopped
    volumes:
      - ./data:/backup/data:ro
      - ./backups:/backup/dumps
    command: sh -c "while true; do cp /backup/data/apikeys.db /backup/dumps/backup-$(date +\%Y\%m\%d\%H\%M\%S).db && sleep 3600; done"
    networks:
      - doctorhealthy1-network

networks:
  doctorhealthy1-network:
    driver: bridge

volumes:
  prometheus_data:
    driver: local

# Security configurations
x-security-defaults: &security-defaults
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  cap_add:
    - NET_BIND_SERVICE
  read_only: true
  tmpfs:
    - /tmp:noexec,nosuid,size=100m

# Apply security defaults to services
x-frontend-defaults: &frontend-defaults
  <<: *security-defaults
  user: nginx

x-backend-defaults: &backend-defaults
  <<: *security-defaults
  user: "1000:1000"

x-monitoring-defaults: &monitoring-defaults
  <<: *security-defaults