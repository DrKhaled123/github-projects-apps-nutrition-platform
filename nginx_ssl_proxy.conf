# Smart SSL Proxy Configuration for Nutrition Platform
# Removes EduVoice conflicts and adds proper SSL

upstream nutrition_backend {
    server 127.0.0.1:8085;
    keepalive 32;
}

# HTTP to HTTPS redirect for both domains
server {
    listen 80;
    server_name my.doctorhealthy1.com doctorhealy1.com www.doctorhealy1.com;
    
    # Remove EduVoice headers
    more_clear_headers "Server";
    add_header Server "DoctorHealthy1/1.0";
    
    return 301 https://$server_name$request_uri;
}

# HTTPS SSL configuration for my.doctorhealthy1.com
server {
    listen 443 ssl http2;
    server_name my.doctorhealthy1.com;
    
    # SSL Certificate paths (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/my.doctorhealthy1.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/my.doctorhealthy1.com/privkey.pem;
    
    # Modern SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_stapling on;
    ssl_stapling_verify on;
    
    # Security headers (replace EduVoice)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Server "DoctorHealthy1/1.0";
    
    # Remove EduVoice traces
    more_clear_headers "X-Powered-By" "X-EduVoice*";
    
    # Serve frontend static files
    root /app/frontend;
    index index.html;
    
    # API proxy to Go backend
    location /api/ {
        proxy_pass http://nutrition_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Remove EduVoice backend headers
        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;
    }
    
    # Health endpoint
    location /health {
        proxy_pass http://nutrition_backend/health;
        proxy_set_header Host $host;
        add_header Cache-Control "no-cache";
    }
    
    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
        
        # Cache static assets
        location ~* \.(css|js|jpg|jpeg|gif|png|ico|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }
    }
}

# HTTPS SSL configuration for doctorhealy1.com (alternative domain)
server {
    listen 443 ssl http2;
    server_name doctorhealy1.com www.doctorhealy1.com;
    
    # SSL Certificate paths (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/doctorhealy1.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/doctorhealy1.com/privkey.pem;
    
    # Same SSL configuration as above
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    
    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Server "DoctorHealthy1/1.0";
    
    # Redirect to primary domain or serve same content
    # Option 1: Redirect to primary domain
    # return 301 https://my.doctorhealthy1.com$request_uri;
    
    # Option 2: Serve same content (current choice)
    root /app/frontend;
    index index.html;
    
    location /api/ {
        proxy_pass http://nutrition_backend;
        proxy_set_header Host my.doctorhealthy1.com;  # Use primary domain in backend
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    location / {
        try_files $uri $uri/ /index.html;
    }
}
