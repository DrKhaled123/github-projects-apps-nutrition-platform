global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "alerts.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'doctorhealthy1-backend'
    static_configs:
      - targets: ['backend:8081']
    scrape_interval: 10s
    metrics_path: '/metrics'
    params:
      format: ['prometheus']

  - job_name: 'doctorhealthy1-frontend'
    static_configs:
      - targets: ['frontend:80']
    scrape_interval: 30s
    metrics_path: '/frontend/metrics'

  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx:80']
    scrape_interval: 30s

  - job_name: 'system'
    static_configs:
      - targets: ['host.docker.internal:9100']